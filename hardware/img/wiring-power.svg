<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 610" width="1270" height="610" role="img" aria-label="One 12V supply feeds a fuse and switch, then splits into a 5.1V regulator for the Raspberry Pi and a 6.0V regulator for the servo rail, with a common ground.">
  <title>Rocky power distribution</title>
  <desc>One 12V supply feeds a fuse and switch, then splits into a 5.1V regulator for the Raspberry Pi and a 6.0V regulator for the servo rail, with a common ground.</desc>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b2430"/></marker></defs>
  <rect width="1270" height="610" fill="#ffffff"/>
  <text x="40" y="44" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1b2430" text-anchor="start" opacity="1.0">Power distribution</text>
  <text x="40" y="68" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6878" text-anchor="start" opacity="1.0">One cable to the desk. Everything else is made inside Rocky.</text>
  <rect x="40" y="120" width="150" height="60" rx="8" fill="#f2f5f9" stroke="#c9d3e0" stroke-width="1.5"/>
  <path d="M 40 128 L 40 172" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <text x="54" y="149.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1b2430" text-anchor="start" opacity="1.0">12V 5A supply</text>
  <text x="54" y="166.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6878" text-anchor="start" opacity="1.0">2.1mm barrel</text>
  <rect x="250" y="124" width="96" height="52" rx="8" fill="#f2f5f9" stroke="#c9d3e0" stroke-width="1.5"/>
  <path d="M 250 132 L 250 168" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <text x="264" y="155.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1b2430" text-anchor="start" opacity="1.0">3A fuse</text>
  <rect x="400" y="124" width="118" height="52" rx="8" fill="#f2f5f9" stroke="#c9d3e0" stroke-width="1.5"/>
  <path d="M 400 132 L 400 168" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <text x="414" y="155.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1b2430" text-anchor="start" opacity="1.0">switch</text>
  <path d="M 190 150 L 250 150" fill="none" stroke="#c2410c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 346 150 L 400 150" fill="none" stroke="#c2410c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 518 150 L 570 150" fill="none" stroke="#c2410c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="544.0" y="141.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#5b6878" text-anchor="middle" opacity="1.0">12V</text>
  <circle cx="570" cy="150" r="5" fill="#c2410c"/>
  <path d="M 570 150 L 570 268 L 630 268" fill="none" stroke="#c2410c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 570 150 L 630 150" fill="none" stroke="#c2410c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="630" y="116" width="190" height="68" rx="8" fill="#f2f5f9" stroke="#c9d3e0" stroke-width="1.5"/>
  <path d="M 630 124 L 630 176" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <text x="644" y="149.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1b2430" text-anchor="start" opacity="1.0">5.1V regulator</text>
  <text x="644" y="166.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6878" text-anchor="start" opacity="1.0">5A, set it before wiring</text>
  <path d="M 820 150 L 900 150" fill="none" stroke="#dc2626" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="860.0" y="141.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#5b6878" text-anchor="middle" opacity="1.0">5.1V</text>
  <rect x="900" y="116" width="170" height="68" rx="8" fill="#f2f5f9" stroke="#c9d3e0" stroke-width="1.5"/>
  <path d="M 900 124 L 900 176" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <text x="914" y="149.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1b2430" text-anchor="start" opacity="1.0">Raspberry Pi 5</text>
  <text x="914" y="166.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6878" text-anchor="start" opacity="1.0">via USB-C</text>
  <rect x="630" y="234" width="190" height="68" rx="8" fill="#f2f5f9" stroke="#c9d3e0" stroke-width="1.5"/>
  <path d="M 630 242 L 630 294" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/>
  <text x="644" y="267.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1b2430" text-anchor="start" opacity="1.0">6.0V regulator</text>
  <text x="644" y="284.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6878" text-anchor="start" opacity="1.0">3A, set it before wiring</text>
  <path d="M 820 268 L 900 268" fill="none" stroke="#b91c1c" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="860.0" y="259.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#5b6878" text-anchor="middle" opacity="1.0">6.0V</text>
  <rect x="900" y="234" width="170" height="68" rx="8" fill="#f2f5f9" stroke="#c9d3e0" stroke-width="1.5"/>
  <path d="M 900 242 L 900 294" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/>
  <text x="914" y="267.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1b2430" text-anchor="start" opacity="1.0">PCA9685 V+</text>
  <text x="914" y="284.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5b6878" text-anchor="start" opacity="1.0">servo rail</text>
  <path d="M 1070 268 L 1128 268 L 1128 330" fill="none" stroke="#b91c1c" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="1102" y1="330" x2="1154" y2="330" stroke="#1b2430" stroke-width="3" stroke-linecap="round"/>
  <line x1="1102" y1="342" x2="1154" y2="342" stroke="#1b2430" stroke-width="3" stroke-linecap="round"/>
  <text x="1162" y="372" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#5b6878" text-anchor="start" opacity="1.0">470uF</text>
  <text x="1162" y="388" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="500" fill="#5b6878" text-anchor="start" opacity="1.0">polarity!</text>
  <path d="M 1128 342 L 1128 470" fill="none" stroke="#111827" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="900" y="340" width="170" height="44" rx="8" fill="#f2f5f9" stroke="#c9d3e0" stroke-width="1.5"/>
  <path d="M 900 348 L 900 376" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="914" y="367.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1b2430" text-anchor="start" opacity="1.0">pan servo</text>
  <rect x="900" y="398" width="170" height="44" rx="8" fill="#f2f5f9" stroke="#c9d3e0" stroke-width="1.5"/>
  <path d="M 900 406 L 900 434" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="914" y="425.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#1b2430" text-anchor="start" opacity="1.0">tilt servo</text>
  <path d="M 880 302 L 880 362 L 900 362" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 858 302 L 858 420 L 900 420" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="892" y="336" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#5b6878" text-anchor="end" opacity="1.0">ch 0</text>
  <text x="892" y="394" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#5b6878" text-anchor="end" opacity="1.0">ch 1</text>
  <line x1="40" y1="470" x2="1230" y2="470" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>
  <text x="40" y="496" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="650" fill="#1b2430" text-anchor="start" opacity="1.0">Common ground</text>
  <text x="40" y="514" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6878" text-anchor="start" opacity="1.0">The Pi&#x27;s ground and the servo ground must be joined, or the PWM</text>
  <text x="40" y="532" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6878" text-anchor="start" opacity="1.0">signal has no reference and the servos twitch continuously.</text>
  <circle cx="115" cy="470" r="5" fill="#111827"/>
  <circle cx="480" cy="470" r="5" fill="#111827"/>
  <circle cx="725" cy="470" r="5" fill="#111827"/>
  <circle cx="1128" cy="470" r="5" fill="#111827"/>
  <path d="M 115 180 L 115 470" fill="none" stroke="#111827" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 480 176 L 480 470" fill="none" stroke="#111827" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 725 302 L 725 470" fill="none" stroke="#111827" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="640" y="528" width="590" height="62" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="660" y="552" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="650" fill="#9a3412" text-anchor="start" opacity="1.0">Set both regulator outputs before connecting anything</text>
  <text x="660" y="574" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a3412" text-anchor="start" opacity="1.0">5.05-5.15V and 5.9-6.1V. A module left set to 12V kills a Pi instantly.</text>
  <line x1="40" y1="552" x2="66" y2="552" stroke="#c2410c" stroke-width="4" stroke-linecap="round"/>
  <text x="76" y="556" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5b6878" text-anchor="start" opacity="1.0">12V input</text>
  <line x1="280" y1="552" x2="306" y2="552" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <text x="316" y="556" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5b6878" text-anchor="start" opacity="1.0">5.1V, Pi</text>
  <line x1="40" y1="574" x2="66" y2="574" stroke="#b91c1c" stroke-width="4" stroke-linecap="round"/>
  <text x="76" y="578" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5b6878" text-anchor="start" opacity="1.0">6.0V, servos</text>
  <line x1="280" y1="574" x2="306" y2="574" stroke="#111827" stroke-width="4" stroke-linecap="round"/>
  <text x="316" y="578" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5b6878" text-anchor="start" opacity="1.0">ground</text>
</svg>
