<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 900" width="1260" height="900" role="img" aria-label="Every board in Rocky and the wires between them, split into the head and the base, with the eleven-conductor harness that crosses the rotating pan joint.">
  <title>Rocky interconnect</title>
  <desc>Every board in Rocky and the wires between them, split into the head and the base, with the eleven-conductor harness that crosses the rotating pan joint.</desc>
  <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b2430"/></marker></defs>
