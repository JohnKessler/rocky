  <text x="40" y="68" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b6878" text-anchor="start" opacity="1.0">The head turns. Every wire between the two halves has to survive that, thousands of times a week.</text>
