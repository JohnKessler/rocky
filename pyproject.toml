[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocky"
version = "1.0.0"
description = "Rocky - a compact desk companion with an expressive face, a camera, and opinions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The runtime is deliberately thin. Everything that touches real hardware is
# an optional extra, so the whole stack runs in simulation on a laptop.
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Installed on the Pi. picamera2 and the ALSA bindings come from apt, not pip.
hardware = [
    "adafruit-circuitpython-pca9685>=3.4",
    "adafruit-blinka>=8.30",
    "pygame-ce>=2.4",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
]
# Local speech. Swap for the cloud backends in config if you prefer.
speech = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "openwakeword>=0.6",
    "webrtcvad>=2.0.10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
rocky = "rocky.cli:main"

[tool.setuptools.packages.find]
where = ["software"]
include = ["rocky*"]

[tool.setuptools.package-data]
"rocky.web" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "B008",  # FastAPI and pydantic both call in argument defaults by design
    # Hardware backends inherit optional no-op hooks (close, setup, teardown).
    # Making them abstract would force every backend to implement a method
    # that does nothing, which is worse than an empty body in the base class.
    "B027",
]
